# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # Torna a tipagem estrita, essencial para manter a estabilidade em 
    # projetos complexos e escaláveis.
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Trata TODOs como warnings para evitar que sejam esquecidos no código base
    todo: warning
    # Avisa sobre imports ausentes no pubspec (muito útil ao dividir pacotes)
    missing_required_param: error
    missing_return: error
    
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/generated_plugin_registrant.dart"
    - build/**
    - web/**

linter:
  # The lint rules applied to this project can be customized in the
  # section below to disable rules from the `package:flutter_lints/flutter.yaml`
  # included above or to enable additional rules. A list of all available lints
  # and their documentation is published at https://dart.dev/lints.
  rules:
    # --------------------------------------------------------------------------
    # REGRAS DE TIPAGEM E BOAS PRÁTICAS (Clean Code / SOLID)
    # --------------------------------------------------------------------------
    always_declare_return_types: true
    avoid_dynamic_calls: true
    avoid_types_as_parameter_names: true
    prefer_final_locals: true
    prefer_final_in_for_each: true
    
    # --------------------------------------------------------------------------
    # PERFORMANCE E IMUTABILIDADE
    # --------------------------------------------------------------------------
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    sized_box_for_whitespace: true
    
    # --------------------------------------------------------------------------
    # ESTILO E LEGIBILIDADE
    # --------------------------------------------------------------------------
    prefer_single_quotes: true
    require_trailing_commas: true
    directives_ordering: true
    camel_case_types: true
    camel_case_extensions: true
    library_names: true
    file_names: true
    avoid_print: true # Em produção, prefira usar um logger customizado
    flutter_style_todos: true
    
    # --------------------------------------------------------------------------
    # PREVENÇÃO DE BUGS (Gerenciamento de Memória/Ciclo de Vida)
    # --------------------------------------------------------------------------
    cancel_subscriptions: true
    close_sinks: true
    test_types_in_equals: true
    throw_in_finally: true
    unnecessary_statements: true
    
    # --------------------------------------------------------------------------
    # MANUTENÇÃO DE DEPENDÊNCIAS
    # --------------------------------------------------------------------------
    sort_pub_dependencies: true
    depend_on_referenced_packages: true

dart_code_linter:
  # Tests are exempt from the metrics: Dart puts every test inside main(), so
  # a test file passes 100 lines quickly and would block any commit touching it.
  metrics-exclude:
    - test/**
  metrics:
    cyclomatic-complexity: 15
    maximum-nesting-level: 5
    lines-of-code: 100
  rules:
    - avoid-nested-conditional-expressions
    - avoid-redundant-async
